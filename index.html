<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="한울아파트">
<title>한울아파트</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 엘리베이터: 오늘의 비서 고르기 -->
  <section id="lift" class="screen">
    <div class="lift-head">
      <small>한울아파트 · <span id="liftDate"></span></small>
      <h1>오늘은 누구로 할래?</h1>
    </div>
    <div class="panel">
      <div class="led"><span id="ledArrow">▲</span><b id="ledNum">1</b></div>
      <div id="floors" class="floors"></div>
    </div>
    <label class="me" id="meRow">나는 <input id="meName" maxlength="12" placeholder="이름"> (이)야</label>
  </section>

  <!-- 메인: 오늘의 비서 -->
  <section id="home" class="screen">
    <img id="bg" class="bg" alt="">
    <div class="shade"></div>
    <header class="hud">
      <button id="hudFloor" class="floor-chip" aria-label="층 바꾸기"></button>
      <div class="who"><b id="hudName"></b><small id="hudTemp"></small></div>
      <div class="stats"><span id="hudAff" title="호감도"></span><span id="hudHeart" title="옷장 하트"></span></div>
    </header>
    <div id="bubble" class="bubble"><b id="bubName"></b><p id="bubText"></p></div>
    <nav class="dock">
      <button data-open="chat"><i>💬</i>대화</button>
      <button data-open="todo"><i>📋</i>할 일<em id="todoBadge"></em></button>
      <button data-open="closet"><i>👗</i>옷장</button>
      <button id="btnLift"><i>🛗</i>층 바꾸기</button>
      <button data-open="set"><i>⚙️</i>설정</button>
    </nav>
  </section>

  <!-- 바텀 시트 -->
  <div id="scrim" class="scrim"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><b id="sheetTitle"></b><small id="sheetSub"></small><button id="sheetX" aria-label="닫기">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
    <div id="sheetFoot" class="sheet-foot"></div>
  </section>

  <!-- 엘리베이터 문 -->
  <div id="doors" class="doors"><i></i><i></i></div>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
